# The repo name differs from the catalog image, and the overlay applies to
# one tag. Drop source, repo, tags, and description to use the shorthand.
source: busybox
repo: busybox-tools
description: Busybox with curl, built from the busybox catalog image.
tags:
  kind: exact
  names:
    - latest
overlay:
  contents:
    packages:
      - curl
  environment:
    APP_ENV: production
