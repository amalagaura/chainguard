# The filename is the repo name. source is the catalog image. tags selects
# one tag. Omit source, description, and tags to use the shorthand.
source: busybox
description: Busybox with curl, built from the busybox catalog image.
tags:
  kind: exact
  names:
    - latest
overlay:
  contents:
    packages:
      - curl
  environment:
    APP_ENV: production
